name: Contact import validation
on:
  push:
    branches: [codex/meshcore-contact-import]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/helpers/share_links.dart lib/screens/contacts_screen.dart lib/widgets/share_in_chat.dart test/helpers/share_links_test.dart test/screens/contact_clipboard_import_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-contact-import
          path: |
            lib/helpers/share_links.dart
            lib/screens/contacts_screen.dart
            lib/widgets/share_in_chat.dart
            test/helpers/share_links_test.dart
            test/screens/contact_clipboard_import_test.dart
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test test/helpers/share_links_test.dart test/screens/contact_clipboard_import_test.dart --reporter expanded
