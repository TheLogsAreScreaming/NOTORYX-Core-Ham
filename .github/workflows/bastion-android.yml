name: Bastion Android APK

on:
  push:
    branches: [bastion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up known-good Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate approved Bastion launcher icons
        run: |
          echo "00393b601be8a7be1dd4f73b64c25718887e27fa75eb8dbf1796c80e76c828d1  branding/bastion-icon.png" | sha256sum -c -
          dart run flutter_launcher_icons
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png
      - name: Apply Flutter 3.41 reorder compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['lib/screens/channels_screen.dart','lib/widgets/path_editor_sheet.dart']:
              p=Path(filename);p.write_text(p.read_text().replace('onReorderItem:','onReorder:'))
          PY
      - name: Wire Bastion home into startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart');s=p.read_text();needle="import 'screens/scanner_screen.dart';"
          if 'bastion_home_screen.dart' not in s:s=s.replace(needle,needle+"\nimport 'screens/bastion_home_screen.dart';")
          s=s.replace("title: 'MeshCore Open'","title: 'Bastion'").replace(": const ScannerScreen(),",": const BastionHomeScreen(),");p.write_text(s)
          PY
      - name: Verify Bastion branding source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = [
              Path('lib/l10n/app_en.arb'),
              Path('lib/l10n/app_localizations_en.dart'),
              Path('lib/main.dart'),
          ]
          for p in checks:
              s = p.read_text()
              if "MeshCore Open" in s and "Built with open-source MeshCore Open components" not in s:
                  raise SystemExit(f"Visible MeshCore Open branding remains in {p}")
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test coverage persistence
        run: flutter test test/services/coverage_history_test.dart
      - name: Build Bastion RC1 APK
        run: flutter build apk --release --target-platform android-arm64 --target lib/main.dart
      - name: Verify packaged Bastion icon resources
        run: |
          python3 - <<'PY'
          import hashlib
          from zipfile import ZipFile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          with ZipFile(apk) as z:
              names = [n for n in z.namelist() if n.startswith('res/') and 'ic_launcher' in n]
              required = ('/ic_launcher.png', '/ic_launcher_foreground.png', '/ic_launcher.xml')
              for suffix in required:
                  if not any(n.endswith(suffix) for n in names):
                      raise SystemExit(f'Missing packaged launcher resource: {suffix}')
              for name in names:
                  print(f'{name}: {hashlib.sha256(z.read(name)).hexdigest()}')
          PY
      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Bastion-RC1-arm64.apk
      - name: Upload Bastion RC1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-RC1-APK
          path: dist/Bastion-RC1-arm64.apk
          if-no-files-found: error
          retention-days: 30
