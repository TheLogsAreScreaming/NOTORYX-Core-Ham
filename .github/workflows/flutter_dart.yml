name: Flutter and Dart

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test contact clipboard imports
        timeout-minutes: 3
        run: flutter test test/screens/contact_clipboard_import_test.dart test/helpers/share_links_test.dart -r expanded

      - name: Run tests
        run: flutter test -r github
