name: Bastion Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing BASTION_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing BASTION_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BASTION_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BASTION_KEY_ALIAS"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free Android build disk
        run: bash ci/free-android-disk.sh
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate approved launcher icon
        run: |
          echo "a04a27fafe146c4f9062b1667ca9fb890a082566303f33ede0893b6a67f6dafa  branding/bastion-icon.png" | sha256sum -c -
          dart run flutter_launcher_icons
      - name: Check formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Configure permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/bastion-release.jks
          test -s android/app/bastion-release.jks
          {
            printf 'storeFile=bastion-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties android/app/bastion-release.jks
      - name: Build signed APK (ARM64) and App Bundle
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release
      - name: Verify signing and prepare artifacts
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist-signing.txt
          # Refuse to publish anything signed with the Android debug key.
          if grep -q "CN=Android Debug" dist-signing.txt; then
            echo "APK is signed with the debug key"; exit 1
          fi
          jarsigner -verify "$AAB" > /dev/null
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp "$APK" "dist/Bastion-$VERSION-arm64-v8a.apk"
          cp "$AAB" "dist/Bastion-$VERSION.aab"
          mv dist-signing.txt dist/signing-certificate.txt
          cd dist
          sha256sum Bastion-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/bastion-release.jks
      - name: Upload signed APK, bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Signed-Android
          path: dist/
          if-no-files-found: error
          retention-days: 30
