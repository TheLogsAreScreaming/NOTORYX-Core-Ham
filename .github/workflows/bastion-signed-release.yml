name: Bastion Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing BASTION_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing BASTION_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing BASTION_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BASTION_KEY_ALIAS"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.41.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate approved launcher icon
        run: |
          echo "00393b601be8a7be1dd4f73b64c25718887e27fa75eb8dbf1796c80e76c828d1  branding/bastion-icon.png" | sha256sum -c -
          dart run flutter_launcher_icons
      - name: Apply Flutter 3.41 reorder compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['lib/screens/channels_screen.dart','lib/widgets/path_editor_sheet.dart']:
              p=Path(filename);p.write_text(p.read_text().replace('onReorderItem:','onReorder:'))
          PY
      - name: Wire Bastion home into startup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart');s=p.read_text();needle="import 'screens/scanner_screen.dart';"
          if 'bastion_home_screen.dart' not in s:s=s.replace(needle,needle+"\nimport 'screens/bastion_home_screen.dart';")
          s=s.replace("title: 'MeshCore Open'","title: 'Bastion'").replace(": const ScannerScreen(),",": const BastionHomeScreen(),");p.write_text(s)
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test core routing and coverage
        run: flutter test test/services/path_history_service_test.dart test/services/coverage_history_test.dart
      - name: Configure permanent release signing
        env:
          KEYSTORE_B64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/bastion-release.jks
          test -s android/app/bastion-release.jks
          {
            printf 'storeFile=bastion-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties android/app/bastion-release.jks
      - name: Build signed Android ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --target lib/main.dart
      - name: Verify signing and prepare artifact
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/bastion-signing.txt
          mkdir -p dist
          cp "$APK" dist/Bastion-signed-arm64.apk
          cd dist
          sha256sum Bastion-signed-arm64.apk > SHA256SUMS.txt
      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Signed-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
