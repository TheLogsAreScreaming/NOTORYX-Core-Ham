name: Build Bastion APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Bastion launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --target lib/main.dart

      - name: Prepare Bastion artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Bastion-arm64-v8a.apk
          cd dist
          sha256sum Bastion-arm64-v8a.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
