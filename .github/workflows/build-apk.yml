name: Build Bastion APK

# Installable Android build for testing: every push to dev and every PR
# produces a downloadable "Bastion-Android-ARM64" artifact (Actions run page,
# Artifacts section). Not a store release.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Bastion-arm64-v8a.apk
          cd dist
          sha256sum Bastion-arm64-v8a.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Android-ARM64
          path: dist/
          if-no-files-found: error
          retention-days: 30
